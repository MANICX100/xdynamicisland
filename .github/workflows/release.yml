name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Portable Linux x86_64 Binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxext-dev libxrandr-dev \
            libcairo2-dev libpango1.0-dev libdbus-1-dev

      - name: Run unit tests
        run: make test

      - name: Build optimized stripped release binary
        run: make size-check

      - name: Inspect runtime shared library dependencies
        run: readelf -d ./xdynamicisland | grep NEEDED

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cp xdynamicisland dist/xdynamicisland-linux-x86_64
          chmod +x dist/xdynamicisland-linux-x86_64
          tar -czf dist/xdynamicisland-linux-x86_64.tar.gz -C dist xdynamicisland-linux-x86_64
          (cd dist && sha256sum xdynamicisland-linux-x86_64 xdynamicisland-linux-x86_64.tar.gz > SHA256SUMS)
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xdynamicisland-linux-x86_64
            dist/xdynamicisland-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
